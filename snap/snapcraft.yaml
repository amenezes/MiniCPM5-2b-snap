name: minicpm5-2b
title: MiniCPM5 2B
base: core24
summary: Local AI with MiniCPM5 2B inference snap
description: |
  MiniCPM5-2B is a dense 2.5B parameter instruction-tuned model from OpenBMB,
  built for on-device and resource-constrained deployment, with reasoning and
  tool-calling capabilities.

  Use this snap to quickly install an optimized environment for local
  inference with MiniCPM5 2B.

  The snap includes the following hardware-optimized inference engines:

  * cpu: Optimized for x64 and ARM (armv8, armv9) CPUs
  * nvidia-gpu: CUDA-enabled GPU acceleration

  The most suitable engine is automatically selected based on the available
  hardware.

  Some accelerators require extra drivers to be usable with this snap:
  https://documentation.ubuntu.com/inference-snaps/how-to/setup/drivers/

  Three quantization variants are available (Q4_K_M by default):

  * Q4_K_M (~1.5 GB): best size/quality trade-off, recommended for most users
  * Q5_K_M (~1.8 GB): better reasoning and tool-calling quality
  * Q6_K (~2.0 GB): near-FP16 quality for accuracy-sensitive workloads

  Switch variants with `sudo minicpm5-2b use-model <variant>`.

  **Requirements:**

  * Memory: from ~2.5 GB on the cpu engine (Q4_K_M). The context size is fitted
    to the available memory automatically (~42 KB per token), up to the model's
    128K maximum. On the nvidia-gpu engine, llama.cpp offloads as many layers as
    fit in the GPU, so partial offload is supported.
  * Disk: ~1.7 GB once installed (Q4_K_M), plus ~1.1 GB if the nvidia-gpu
    engine is selected (~730 MB download).

  **Install:**

  `sudo snap install minicpm5-2b`

  **Run:**

  `minicpm5-2b`

  **License:**

  The MiniCPM5-2B model is provided by OpenBMB under the Apache-2.0 license:
  https://huggingface.co/openbmb/MiniCPM5-2B-GGUF

  The licenses of all the bundled software can be found after installing the snap at
  `/snap/minicpm5-2b/current/usr/share/doc`.
icon: snap/gui/icon-256.png
license: GPL-3.0
website: https://github.com/amenezes/miniCPM5-2b
source-code: https://github.com/amenezes/miniCPM5-2b
issues: https://github.com/amenezes/miniCPM5-2b/issues
contact: https://github.com/amenezes/miniCPM5-2b/issues

adopt-info: version

grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

slots:
  provider:
    interface: content
    content: inference-provider
    source:
      read:
        - $SNAP_COMMON/share/provider

plugs:
  # To allow side-loading models into server (root daemon) from user home directory
  home:
    read: all

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR

layout:
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/modelctl version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"

  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.14/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |
      # For tab completion
      ln --symbolic ./modelctl bin/minicpm5-2b

      craftctl default

  cli-dependencies:
    plugin: nil
    stage-packages:
      - pciutils # lspci

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead
  # be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/

      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.1.0/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/

  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "server-webui.sh": bin/

  local-component-files:
    # Use the cmake plugin instead of "dump" to prevent unwanted copies
    # See https://github.com/canonical/craft-parts/issues/1609
    plugin: cmake
    source: components
    override-build: |
      cp -rf --archive --link --no-dereference ${CRAFT_PART_SRC}/* ${CRAFT_PART_INSTALL}
    organize:
      "model-q4-k-m-gguf/MiniCPM5-2B-Q4_K_M.gguf": (component/model-q4-k-m-gguf)
      "model-q5-k-m-gguf/MiniCPM5-2B-Q5_K_M.gguf": (component/model-q5-k-m-gguf)
      "model-q6-k-gguf/MiniCPM5-2B-Q6_K.gguf": (component/model-q6-k-gguf)

    prime:
      # Exclude everything not explicitly organized
      - -*

  # Pinned deliberately: MiniCPM5 tool calling requires the llama.cpp MiniCPM5
  # chat parser, first available in build b10154. b10344 is the build also used
  # by the phi4, smollm2 and gemma4 snaps. Bump only with the tool-calling test.
  llamacpp:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b10344/llamacpp-amd64.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b10344/llamacpp-arm64.tar.gz
    stage-packages:
      - libgomp1
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp

      craftctl default
    organize:
      "*": (component/llamacpp)

  # Same build tag as the cpu runtime: the CUDA and CPU tarballs of a given
  # build come from the same upstream commit, so MiniCPM5 support is identical.
  llamacpp-cuda:
    plugin: dump
    source:
      - on amd64: https://github.com/canonical/llama.cpp-builds/releases/download/b10344/llamacpp-amd64+cuda12.9.tar.gz
      - on arm64: https://github.com/canonical/llama.cpp-builds/releases/download/b10344/llamacpp-arm64+cuda12.9.tar.gz
    stage-packages:
      - libgomp1
    override-build: |
      # Move license files to be included in the snap, not the component
      mkdir -p $CRAFT_PRIME/usr/share/doc/
      mv licenses $CRAFT_PRIME/usr/share/doc/llama.cpp+cuda

      craftctl default
    organize:
      "*": (component/llamacpp-cuda)

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-minicpm5-2b $license_dir/

components:
  model-q4-k-m-gguf:
    type: standard
    summary: MiniCPM5 2B Q4_K_M GGUF
    description: Model weights for MiniCPM5-2B in GGUF format, quantized to Q4_K_M

  model-q5-k-m-gguf:
    type: standard
    summary: MiniCPM5 2B Q5_K_M GGUF
    description: Model weights for MiniCPM5-2B in GGUF format, quantized to Q5_K_M

  model-q6-k-gguf:
    type: standard
    summary: MiniCPM5 2B Q6_K GGUF
    description: Model weights for MiniCPM5-2B in GGUF format, quantized to Q6_K

  llamacpp:
    type: standard
    summary: llama.cpp using default CPU instruction sets
    description: LLM inference in C/C++

  llamacpp-cuda:
    type: standard
    summary: llama.cpp with CUDA backend
    description: LLM inference in C/C++

apps:
  minicpm5-2b:
    command: bin/modelctl
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - home

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind
