name: cpu
summary: Optimized for various CPUs
description: |
  This engine uses llama.cpp.

  It is optimized for both amd64 and arm64 CPU architectures, for a wide range
  of architecture variants.
vendor: amenezes.net

devices:
  anyof:
    - type: cpu
      architecture: amd64
    - type: cpu
      architecture: arm64

runtime: llamacpp

model:
  default: minicpm5-2b
  options:
    - minicpm5-2b
    - minicpm5-2b-q5km
    - minicpm5-2b-q6k

configurations:
  sleep-idle-seconds: 600
  min-context-size: 4096
  # Keep the reasoning trace in the full history. Quoted on purpose: it is read
  # back as a string by engines/*/server. Pinned here because the llama.cpp
  # default changed between builds (b10344: off, b11100: on).
  reasoning-preserve: "true"
