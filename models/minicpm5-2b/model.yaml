# Default variant (Q4_K_M). The name carries no quantization suffix: it is what
# the OpenAI API serves as the model id (see engines/*/server, --alias).
# Additional variants: minicpm5-2b-q5km, minicpm5-2b-q6k, minicpm5-2b-dspark.
name: minicpm5-2b
description: MiniCPM5-2B, a 2.5B dense instruction-tuned model for on-device deployment, with reasoning and tool-calling
model-card-url: https://huggingface.co/openbmb/MiniCPM5-2B-GGUF
format: GGUF
quantization: Q4_K_M

disk-size: 1561M

capabilities:
  - text
  - thinking
  - tools

components:
  - model-q4-k-m-gguf

environment:
  # Single-file GGUF (no sharding), so no layout/symlinks are needed.
  - MODEL_FILE=$SNAP_COMPONENTS/model-q4-k-m-gguf/MiniCPM5-2B-Q4_K_M.gguf
